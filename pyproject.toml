[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autolab"
version = "0.1.0"
description = "Autonomous research loop: idea -> lit review -> hypotheses -> local experiments -> paper draft, driven by Claude subagents over a shared typed-artifact thread"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "numpy>=2.0.0",
    "rapidfuzz>=3.10.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=5.4.1",
    "datasets>=4.8.4",
    # MLX is the preferred framework for ExperimentPlans on Apple Silicon
    # (unified memory, GPU + Neural Engine). Marker scopes the install so
    # non-Apple-Silicon machines don't fail uv sync.
    "mlx>=0.30.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.21.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torchvision>=0.27.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.4.0",
]

[project.scripts]
autolab = "autolab.orchestrator:main"
autolab-finalize = "autolab.finalize:main"
autolab-dashboard = "autolab.dashboard.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["autolab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
# Format the test suite first; widen later once the rest of the tree is
# formatted. Excludes match what `ruff` skips.
include = "^/(tests)/.*\\.py$"
extend-exclude = '''
(
  /\.venv/
  | /\.git/
  | /projects/
  | /skills/
)
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["projects", ".venv", "skills"]

[tool.ruff.lint]
# E/F/W = pycodestyle + pyflakes; I = isort; B = bugbear; UP = pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
# Ignore: E501 (long descriptive strings are fine; black handles formatting),
# E702/E731 (semicolons and lambdas — stylistic, not bugs; the existing
# dashboard parsing code uses them deliberately for compactness),
# UP038 (`isinstance(x, X | Y)` is *slower* at runtime than the tuple form
# because it allocates a UnionType per call — ruff itself deprecated this).
ignore = ["E501", "E702", "E731", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow `assert False` in tests
