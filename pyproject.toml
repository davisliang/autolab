[project]
name = "autolab"
version = "0.1.0"
description = "Autonomous research loop: idea -> lit review -> hypotheses -> local experiments -> paper draft, driven by Claude subagents over a shared typed-artifact thread"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "numpy>=2.0.0",
    "rapidfuzz>=3.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.30.0",
]
torch = [
    "torch>=2.4.0",
]
data = [
    "datasets>=3.0.0",
]

[tool.uv]
package = false
