[project]
name = "autolab"
version = "0.1.0"
description = "Autonomous research loop: idea -> lit review -> hypotheses -> local experiments -> paper draft, driven by Claude subagents over a shared typed-artifact thread"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "numpy>=2.0.0",
    "rapidfuzz>=3.10.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=5.4.1",
    "datasets>=4.8.4",
    "weasyprint>=68.1",
    # MLX is the preferred framework for ExperimentPlans on Apple Silicon
    # (unified memory, GPU + Neural Engine). Marker scopes the install so
    # non-Apple-Silicon machines don't fail uv sync.
    "mlx>=0.30.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
torch = [
    "torch>=2.4.0",
]
data = [
    "datasets>=3.0.0",
]

[tool.uv]
package = false
